<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<meta name="description" content="Webカメラ・スマートフォンのカメラで斜め上から映したテーブルを、真上から見たような映像に変形して表示します。">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>カメラ斜め映像変形</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ===== ヘッダー ===== -->
  <header id="topbar">
    <div class="topbar-left">
      <span class="logo">▱</span>
      <h1>カメラ斜め映像変形</h1>
    </div>
    <div class="topbar-right">
      <span id="mode-chip" class="chip chip-setup">設定モード</span>
      <span id="angle-chip" class="chip chip-angle">真上</span>
    </div>
  </header>

  <!-- ===== 映像ステージ ===== -->
  <main id="stage">
    <div id="stage-inner">
      <!-- 設定モード: 映像 + 半透明台形オーバーレイ -->
      <canvas id="setup-canvas"></canvas>
      <!-- プレビューモード: 平面に変形した映像 -->
      <canvas id="preview-canvas" class="hidden"></canvas>
      <!-- プレビュー用ガイドグリッド（WebGL上に重ねる） -->
      <div id="grid-overlay" class="grid-overlay hidden"></div>

      <!-- 起動前オーバーレイ -->
      <div id="splash" class="overlay">
        <div class="overlay-box">
          <div class="overlay-icon">📷</div>
          <h2>カメラを開始します</h2>
          <p>
            テーブルを斜め上から映したカメラ映像を、<br>
            真上から見たような映像に変形します。
          </p>
          <button id="splash-start" class="btn btn-primary btn-lg">
            <span class="btn-ico">▶</span> カメラを開始
          </button>
          <p class="overlay-note">
            ※ カメラの使用を許可してください（HTTPS または localhost が必要です）
          </p>
        </div>
      </div>

      <!-- エラーオーバーレイ -->
      <div id="error-overlay" class="overlay hidden">
        <div class="overlay-box">
          <div class="overlay-icon">⚠️</div>
          <h2>カメラを利用できません</h2>
          <p id="error-text">—</p>
          <button id="error-retry" class="btn btn-primary btn-lg">再試行</button>
        </div>
      </div>

      <!-- 画面内ヒント -->
      <div id="hint" class="hint">
        <span id="hint-text">台形の枠がテーブルの範囲に合うように、カメラの角度を選んでください</span>
      </div>
    </div>
  </main>

  <!-- ===== 操作バー ===== -->
  <nav id="controls">
    <div class="controls-main">
      <!-- モード切替ボタン（1つ） -->
      <button id="mode-btn" class="btn btn-mode" type="button">
        <span class="btn-ico">👁</span>
        <span class="btn-label">プレビューへ切替</span>
      </button>

      <!-- 角度切替ボタン（1つ・押す度に 真上→斜め①→斜め②→真上…） -->
      <button id="angle-btn" class="btn btn-angle" type="button">
        <span class="btn-ico">📐</span>
        <span class="btn-label">カメラ角度：<strong id="angle-btn-value">真上</strong></span>
        <span class="btn-sub" id="angle-btn-next">次：斜め①（60度）</span>
      </button>

      <!-- 補助メニュー -->
      <div class="controls-side">
        <button id="switch-cam-btn" class="btn btn-icon" type="button" title="カメラを切り替え" aria-label="カメラを切り替え">⟲</button>
        <button id="settings-btn" class="btn btn-icon" type="button" title="詳細設定" aria-label="詳細設定">⚙</button>
      </div>
    </div>

    <!-- 角度の3段階インジケーター -->
    <div class="angle-steps" id="angle-steps">
      <button class="step" data-index="0" type="button"><b>真上</b><span>90度</span></button>
      <button class="step" data-index="1" type="button"><b>斜め①</b><span>60度</span></button>
      <button class="step" data-index="2" type="button"><b>斜め②</b><span>45度</span></button>
    </div>
  </nav>

  <!-- ===== 詳細設定パネル ===== -->
  <section id="panel" class="panel hidden" aria-hidden="true">
    <div class="panel-head">
      <h2>詳細設定</h2>
      <button id="panel-close" class="btn btn-icon" type="button" aria-label="閉じる">✕</button>
    </div>

    <div class="panel-body">
      <div class="field">
        <label for="camera-select">カメラ</label>
        <select id="camera-select" class="select"></select>
      </div>

      <div class="field">
        <div class="field-head">
          <label for="spread-range">台形の強さ</label>
          <output id="spread-out">0.35</output>
        </div>
        <input id="spread-range" class="range" type="range" min="0.10" max="0.70" step="0.01" value="0.35">
        <p class="field-note">テーブルの写っている奥行き量。大きいほど台形の傾きが強くなります。</p>
      </div>

      <div class="field">
        <div class="field-head">
          <label for="offset-range">枠の上下位置</label>
          <output id="offset-out">0%</output>
        </div>
        <input id="offset-range" class="range" type="range" min="-40" max="40" step="1" value="0">
      </div>

      <div class="field">
        <label for="ratio-select">出力の縦横比</label>
        <select id="ratio-select" class="select">
          <option value="1.3333">4 : 3</option>
          <option value="1.7778">16 : 9</option>
          <option value="1.5">3 : 2</option>
          <option value="1">1 : 1</option>
          <option value="0.75">3 : 4（縦）</option>
        </select>
      </div>

      <div class="field field-row">
        <label for="mirror-check">左右反転（ミラー）</label>
        <input id="mirror-check" type="checkbox" class="switch">
      </div>

      <div class="field field-row">
        <label for="grid-check">ガイドグリッドを表示</label>
        <input id="grid-check" type="checkbox" class="switch" checked>
      </div>

      <div class="field">
        <button id="shot-btn" class="btn btn-secondary btn-block" type="button">🖼 現在の映像を保存（PNG）</button>
      </div>

      <div class="field">
        <button id="reset-btn" class="btn btn-ghost btn-block" type="button">設定を初期値に戻す</button>
      </div>

      <div id="info" class="info">
        <div><span>状態</span><b id="info-state">停止中</b></div>
        <div><span>入力解像度</span><b id="info-res">—</b></div>
        <div><span>描画</span><b id="info-fps">—</b></div>
        <div><span>変形方式</span><b id="info-engine">—</b></div>
      </div>
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>
</div>

<video id="video" playsinline autoplay muted></video>

<script src="js/geometry.js"></script>
<script src="js/renderer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
